<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 100" width="100%" height="100%">
  <defs>
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffc558" />
      <stop offset="100%" stop-color="#ff7300" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Tiger Avatar -->
  <g transform="translate(10, 10)">
    <circle cx="40" cy="40" r="38" fill="#111823" stroke="url(#gold-grad)" stroke-width="3" filter="url(#glow)" />
    <!-- Stylized Tiger Face -->
    <path d="M40,20 L30,32 L36,35 L30,45 L37,45 L40,65 L43,45 L50,45 L44,35 L50,32 Z" fill="url(#gold-grad)" />
    <path d="M22,30 L28,26 L26,38 Z" fill="url(#gold-grad)" />
    <path d="M58,30 L52,26 L54,38 Z" fill="url(#gold-grad)" />
    <!-- Tiger Eyes -->
    <circle cx="34" cy="38" r="2.5" fill="#fff" />
    <circle cx="46" cy="38" r="2.5" fill="#fff" />
  </g>
  <!-- Brand Text -->
  <text x="110" y="52" font-family="'Outfit', 'Inter', sans-serif" font-weight="900" font-size="34" fill="url(#gold-grad)" letter-spacing="2" filter="url(#glow)">TIGER</text>
  <text x="245" y="52" font-family="'Outfit', 'Inter', sans-serif" font-weight="900" font-size="34" fill="#ffffff" letter-spacing="2">EXCHANGE</text>
  <text x="110" y="78" font-family="'Outfit', 'Inter', sans-serif" font-weight="700" font-size="14" fill="#8b9aae" letter-spacing="6">WWW.TIGER365.IN</text>
</svg>